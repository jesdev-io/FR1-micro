[env:fr1-micro]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    platformio/toolchain-xtensa@^2.100300.220621
    tool-esptoolpy@~1.40501.0

lib_deps =
    https://github.com/jesdev-io/libFRX.git#dev

; Board-specific configuration for Waveshare ESP32-S3-Touch-LCD-1.47
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

build_flags =
    -DUTILS_DEBUG_PRINT_ENABLE
    -DFRX_ENABLE_MODULE_UTILS
    -DFRX_ENABLE_MODULE_AUDIO
    -DFRX_ENABLE_MODULE_EXT_FLASH
    -DFRX_ENABLE_MODULE_SDCARD
    -DFRX_ENABLE_MODULE_WAV
    -DFRX_ENABLE_MODULE_I2C
    ; Audio pins for Waveshare ESP32-S3-Touch-LCD-1.47
    -DAUDIO_I2S_PORT=I2S_NUM_0
    -DAUDIO_PIN_MEMS_I2S_BCLK=7
    -DAUDIO_PIN_MEMS_I2S_WS=8
    -DAUDIO_PIN_MEMS_I2S_IN=9
    -DAUDIO_PIN_DAC_I2S_OUT=10
    ; External Flash (W25Q128) - SPI interface
    ; Using SPI2/3 (general purpose SPI ports per datasheet Section 4.10)
    ; Pins selected based on GPIO Matrix capabilities (Table 2-3)
    -DEF_SPI_HOST=SPI
    -DEF_PIN_MISO=31  ; SPIQ - Must determine actual GPIO (check schematic)
    -DEF_PIN_MOSI=32  ; SPID - Must determine actual GPIO (check schematic)
    -DEF_PIN_SCLK=30  ; SPICLK - Must determine actual GPIO (check schematic)
    -DEF_PIN_CS=29    ; SPICS0 - Must determine actual GPIO (check schematic)
    ; SD Card (SDMMC) - fixed pins on this board
    -DSDCARD_MODE_SDMMC
    -DSDCARD_SDMMC_PIN_CLK=16
    -DSDCARD_SDMMC_PIN_CMD=15
    -DSDCARD_SDMMC_PIN_D0=17
    -DSDCARD_SDMMC_PIN_D1=18
    -DSDCARD_SDMMC_PIN_D2=13
    -DSDCARD_SDMMC_PIN_D3=14
    '-DSDCARD_DEFAULT_FNAME_WAV="fr1_rec_0000.wav"'
    ; I2C pins
    -DI2C_BASE_SCL=10
    -DI2C_BASE_SDA=11
    -DI2C_BASE_NUM=I2C_NUM_0
    ; misc
    -DADC_BATT_PIN=12

monitor_speed = 115200
; monitor_filters = default, esp32_exception_decoder
